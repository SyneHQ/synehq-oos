<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">SyneHQ OOS</title>
  <desc id="desc">Your database, in your browser. A typographic cover for a personal database explorer. Product illustration.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eee6f3" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#faf7fc"/><stop offset="1" stop-color="#faf7fc" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1440" height="520" fill="#faf7fc"/>
  <rect x="775" width="665" height="520" fill="url(#grid)"/>
  <rect x="720" width="260" height="520" fill="url(#fade)"/>
  <rect x="64" y="60" width="6" height="25" fill="#79569b"/>
