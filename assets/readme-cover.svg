  <text x="62" y="196" fill="#35243f" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="-2">Your database,</text>
  <text x="62" y="268" fill="#35243f" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="-2">in your browser.</text>
  <text x="66" y="326" fill="#9683a3" font-family="Arial, Helvetica, sans-serif" font-size="22">Tables. Schemas. Relationships. SQL.</text>
  <path d="M66 403 H717" stroke="#ded0e8"/>
  <text x="66" y="443" fill="#9683a3" font-family="Arial, Helvetica, sans-serif" font-size="15">A personal explorer, powered by Kelvo.</text>
  <text x="1325" y="468" fill="#a891b6" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.5" text-anchor="end">PERSONAL DATABASE EXPLORER</text>
  <g fill="none" stroke="#79569b" stroke-width="2">
    <path d="M995 174 H1048 V295 H1120"/>
    <circle cx="995" cy="174" r="5" fill="#faf7fc"/>
    <circle cx="1120" cy="295" r="5" fill="#faf7fc"/>
  </g>
