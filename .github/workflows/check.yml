name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          AUTH_URL: http://localhost:3100
      - run: node --import tsx tests/static-build-smoke.ts
      - name: Build the Hakopod dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_OOS_BASE_PATH: /synehq
          NEXT_TELEMETRY_DISABLED: "1"
          AUTH_URL: http://localhost:3100
      - name: Check the Hakopod static routes and assets
        run: node --import tsx tests/static-build-smoke.ts
        env:
          OOS_BASE_PATH: /synehq
  container:
    needs: web
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read image inputs
        id: image
        shell: bash
        run: |
          kelvo_revision="$(cat deploy/kelvo-revision)"
          if [[ ! "$kelvo_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "deploy/kelvo-revision must contain one full commit SHA." >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "kelvo_context=https://github.com/SyneHQ/kelvo-go.git#$kelvo_revision" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container and publish from main
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            kelvo_source=${{ steps.image.outputs.kelvo_context }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:edge
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64
