name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          AUTH_URL: http://localhost:3100
  container:
    needs: web
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read image inputs
        id: image
        shell: bash
        run: |
          kelvo_revision="$(cat deploy/kelvo-revision)"
          if [[ ! "$kelvo_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "deploy/kelvo-revision must contain one full commit SHA." >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "kelvo_context=https://github.com/SyneHQ/kelvo-go.git#$kelvo_revision" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            kelvo_source=${{ steps.image.outputs.kelvo_context }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Check native container runtime
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          sudo env AUTH_URL=http://127.0.0.1:3100 sh deploy/run-container.sh "$IMAGE"
          node tests/container-smoke.mjs
      - name: Show failed container logs
        if: failure()
        run: docker logs --tail 100 synehq-oos || true
      - name: Remove test container and volume
        if: always()
        run: |
          docker rm -f synehq-oos || true
          docker volume rm synehq-oos-data || true
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified platform image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker push "$tag"
          reference="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
          [[ "$reference" == "$IMAGE"@sha256:* ]]
          digest="${reference##*@sha256:}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$reference" > "$RUNNER_TEMP/digests/$ARCH"
      - name: Save platform digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: container-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1
          overwrite: true
          if-no-files-found: error
  publish:
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: container-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify both architectures
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          references=()
          for arch in amd64 arm64; do
            reference="$(cat "$RUNNER_TEMP/digests/$arch")"
            [[ "$reference" == "$image"@sha256:* ]]
            digest="${reference##*@sha256:}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            references+=("$reference")
          done
          docker buildx imagetools create --tag "$image:sha-$GITHUB_SHA" "${references[@]}"
          docker buildx imagetools inspect --raw "$image:sha-$GITHUB_SHA" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          docker buildx imagetools create --tag "$image:edge" "$image:sha-$GITHUB_SHA"
